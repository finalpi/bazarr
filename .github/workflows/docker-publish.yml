name: Build and publish enhanced Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  subtitle-validation:
    name: Verify subtitle matching regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify matching, uncertainty and exclusion boundaries
        env:
          PYTHONPATH: libs:custom_libs
        run: >-
          python -m pytest --confcutdir=tests/audio_validation
          tests/audio_validation/test_timing.py
          tests/audio_validation/test_reference_alignment.py
          tests/audio_validation/test_reference_sampling.py
          tests/audio_validation/test_subtitle_rejections.py
          tests/audio_validation/test_rejection_flow.py
          tests/audio_validation/test_manual_download_jobs.py
          tests/audio_validation/test_subtitle_coverage.py
          tests/audio_validation/test_subhd_coverage_selection.py
          tests/audio_validation/test_subhd_script_guard.py
          tests/audio_validation/test_false_rejection_regression.py
          -q

  publish:
    name: Publish multi-platform image
    needs: subtitle-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Verify manual search rejection messages
        working-directory: frontend
        run: npx vitest run src/components/modals/ManualSearchModal.test.tsx

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/audio-timing/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
